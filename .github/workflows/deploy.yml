# Typecheck and build every PR; deploy `main` to GitHub Pages.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the local version; bump deliberately.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # .npmrc points @whitecapgeospatial at GitHub Packages. The built-in
          # GITHUB_TOKEN cannot read another repo's packages, so this is a PAT
          # with `read:packages`.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_GITHUB_TOKEN }}

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
